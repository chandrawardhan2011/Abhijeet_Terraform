# group_vars/linux_clients.yml
# Linux clients run Jammy (22.04) — override apt mirror port to use
# the jammy-specific mirror instead of the default noble mirror.

offline_apt_port: 8082

# Convenience URL override (built from offline_repo_host in all.yml)
offline_apt_url: "http://{{ offline_repo_host }}:{{ offline_apt_port }}"

