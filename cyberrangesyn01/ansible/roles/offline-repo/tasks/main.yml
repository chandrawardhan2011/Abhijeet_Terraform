---
# roles/offline-repo/tasks/main.yml
# Points the target VM's apt at the local offline mirror on the Terraform server.
# Run this FIRST on every host (it is included at the top of site.yml).
#
# When offline_mode is false this role does nothing — so you can flip back to
# online installs by setting offline_mode: false in group_vars/all.yml.
- name: Stop and disable unattended-upgrades to prevent apt lock conflicts
  systemd:
    name: unattended-upgrades
    state: stopped
    enabled: no
  ignore_errors: yes

- name: Kill any running unattended-upgr process
  shell: killall unattended-upgr 2>/dev/null || true
  changed_when: false

- name: Wait for apt lock to be released
  shell: | 
    while fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/cache/apt/archives/lock > /dev/null 2>&1; do 
       sleep 3
    done
  args: 
    executable: /bin/bash
  changed_when: false

- name: Configure offline apt mirror
  when: offline_mode | bool
  block:

    - name: Disable all existing apt sources (offline mode)
      shell: |
        mkdir -p /etc/apt/sources.list.d/disabled
        mv /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/disabled/ 2>/dev/null || true
        cp /etc/apt/sources.list /etc/apt/sources.list.offline-backup 2>/dev/null || true
        echo "" > /etc/apt/sources.list
      args:
        creates: /etc/apt/sources.list.offline-backup

    - name: Add local offline apt mirror
      copy:
        dest: /etc/apt/sources.list.d/offline-mirror.list
        content: |
          # CyberRange offline mirror — served by the Terraform control node
          deb [trusted=yes] {{ offline_apt_url }}/ pool/
        owner: root
        group: root
        mode: '0644'

    - name: Update apt cache from offline mirror
      apt:
        update_cache: yes
      register: offline_apt_update
      retries: 3
      delay: 5
      until: offline_apt_update is succeeded

    - name: Confirm offline mirror is reachable
      debug:
        msg: "Offline apt mirror active on {{ inventory_hostname }} → {{ offline_apt_url }}"

- name: Skip offline setup (online mode)
  when: not (offline_mode | bool)
  debug:
    msg: "offline_mode is false — using normal internet apt repos on {{ inventory_hostname }}"
