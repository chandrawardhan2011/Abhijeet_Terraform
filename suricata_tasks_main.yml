---
# ansible/roles/suricata/tasks/main.yml
# Configures Suricata in IDS (passive) mode — FULLY OFFLINE
#
# Prerequisites:
#   Linux  — Suricata pre-installed in Ubuntu template (apt install suricata)
#   Windows — Suricata + Npcap pre-installed in Windows golden template
#   Both   — rules/ folder (ET Open) in roles/suricata/files/rules/
#             suricata-windows.yaml.j2 in roles/suricata/templates/
#
# Ansible only handles: config deployment, rules copy, service registration, Wazuh integration

# ── Linux ─────────────────────────────────────────────────────────────────────
- name: Suricata Linux block
  block:

    - name: Ensure /etc/suricata directory exists
      file:
        path: /etc/suricata
        state: directory
        owner: root
        group: suricata
        mode: '0750'

    - name: Deploy suricata.yaml from template
      template:
        src: suricata-linux.yaml.j2
        dest: /etc/suricata/suricata.yaml
        owner: root
        group: suricata
        mode: '0640'
      notify: restart suricata linux

    - name: Ensure rules directory exists
      file:
        path: /var/lib/suricata/rules
        state: directory
        owner: suricata
        group: suricata
        mode: '0750'

    - name: Ensure log directory exists
      file:
        path: /var/log/suricata
        state: directory
        owner: suricata
        group: suricata
        mode: '0750'

    - name: Copy ET Open rules folder from Ansible controller to target
      copy:
        src: files/rules/
        dest: /var/lib/suricata/rules/
        owner: suricata
        group: suricata
        mode: '0640'
      notify: restart suricata linux

    - name: Enable and start Suricata
      systemd:
        name: suricata
        enabled: yes
        state: started

    # Skip on wazuh-server-1 — runs wazuh-manager not wazuh-agent
    - name: Add Suricata eve.json to Wazuh agent config
      blockinfile:
        path: /var/ossec/etc/ossec.conf
        marker: "<!-- {mark} ANSIBLE SURICATA -->"
        insertbefore: '</ossec_config>'
        block: |
          <localfile>
            <log_format>json</log_format>
            <location>/var/log/suricata/eve.json</location>
          </localfile>
      notify: restart wazuh-agent linux
      ignore_errors: yes
      when: "'wazuh_servers' not in group_names"

    - name: Drop install marker
      copy:
        dest: /etc/suricata/.ansible_configured
        content: "Suricata configured by Ansible {{ ansible_date_time.iso8601 }}\n"
        mode: '0644'

  when: ansible_os_family == "Debian"
  become: yes

# ── Windows ───────────────────────────────────────────────────────────────────
# Suricata + Npcap pre-installed in golden template
# Ansible registers service, deploys config, copies rules, starts service
- name: Suricata Windows block
  block:

    - name: Ensure rules directory exists
      win_file:
        path: 'C:\Program Files\Suricata\rules'
        state: directory

    - name: Ensure log directory exists
      win_file:
        path: 'C:\Program Files\Suricata\log'
        state: directory

    - name: Deploy suricata.yaml from template
      win_template:
        src: suricata-windows.yaml.j2
        dest: 'C:\Program Files\Suricata\suricata.yaml'

    - name: Copy ET Open rules folder from Ansible controller to target
      win_copy:
        src: files/rules/
        dest: 'C:\Program Files\Suricata\rules\'

    - name: Set folder permissions for Suricata
      win_command: icacls "C:\Program Files\Suricata" /grant "SYSTEM:(OI)(CI)F" /T
      ignore_errors: yes

    - name: Delete existing Suricata service if present
      win_command: sc.exe delete Suricata
      ignore_errors: yes

    - name: Install Suricata as Windows service
      win_command: >
        suricata.exe --service-install
        -c "C:\Program Files\Suricata\suricata.yaml"
        -i {{ ansible_host }}
      args:
        chdir: 'C:\Program Files\Suricata'
      register: svc_install
      failed_when:
        - svc_install.rc is defined
        - svc_install.rc != 0
        - "'already' not in (svc_install.stderr | lower | default(''))"
        - "'1073' not in (svc_install.stderr | default(''))"
      ignore_errors: yes

    - name: Change Suricata service startup parameters
      win_command: >
        suricata.exe --service-change-params
        -c "C:\Program Files\Suricata\suricata.yaml"
        -i {{ ansible_host }}
      args:
        chdir: 'C:\Program Files\Suricata'
      ignore_errors: yes

    - name: Set Suricata service to delayed auto start
      win_command: sc.exe config Suricata start= delayed-auto
      ignore_errors: yes

    - name: Set Suricata service recovery options
      win_command: sc.exe failure Suricata reset= 86400 actions= restart/5000/restart/5000/reboot/5000
      ignore_errors: yes

    - name: Wait for service registration to complete
      win_pause:
        seconds: 5

    - name: Start Suricata service
      win_command: net start Suricata
      register: svc_start
      failed_when:
        - svc_start.rc is defined
        - svc_start.rc not in [0, 2]
        - "'already running' not in (svc_start.stdout | lower | default(''))"
      ignore_errors: yes

    - name: Add Suricata eve.json to Wazuh agent config
      win_lineinfile:
        path: 'C:\Program Files (x86)\ossec-agent\ossec.conf'
        insertbefore: '</ossec_config>'
        line: "  <localfile>\n    <log_format>json</log_format>\n    <location>C:\\Program Files\\Suricata\\log\\eve.json</location>\n  </localfile>"
        state: present
      notify: restart wazuh-agent windows
      ignore_errors: yes

    - name: Drop install marker
      win_copy:
        dest: 'C:\Program Files\Suricata\.ansible_configured'
        content: "Suricata configured by Ansible {{ ansible_date_time.iso8601 }}"

  when: ansible_os_family == "Windows"
