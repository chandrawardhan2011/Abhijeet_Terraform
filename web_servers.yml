# group_vars/web_servers.yml
# ─────────────────────────────────────────────────────────────────────────────
# WEB SERVER CONFIGURATION
# ─────────────────────────────────────────────────────────────────────────────
# Two labs are hosted on separate ports:
#
#  A) vulnlab        (:9001) — Configurable training lab
#     - 5 vulnerability classes (SQLi, XSS, IDOR, CMDi, LFI)
#     - 3 difficulty levels (easy / medium / hard)
#     - State controlled via POST /api/configure
#     - SQLite DB (self-contained, no external DB needed)
#     - Files: roles/web-server/files/sites/vulnlab/
#
#  B) cyberrange-lab (:9002) — Live fire lab (all vulns always active)
#     - SQLi, XSS, IDOR, LFI always on
#     - Connects to MariaDB on db-server (10.0.20.30) — cyber_range DB
#     - DB server MUST be deployed before this (site.yml enforces order)
#     - Files: roles/web-server/files/sites/cyberrange-lab/
#
# lab_mode (passed via Ansible extra-vars from operator panel):
#   "training"  → deploy vulnlab only (port 9001)
#   "exercise"  → deploy cyberrange-lab only (port 9002)
#   "both"      → deploy both (default — scenario 1 / scenario 3)
# ─────────────────────────────────────────────────────────────────────────────

# Default lab_mode — overridden by -e lab_mode=... from operator panel
lab_mode: "both"

# ICP app removed — set to false
deploy_icp: false

# ── Website definitions ───────────────────────────────────────────────────────
# Full list — the web-server role filters this based on lab_mode
websites_all:
  - name: vulnlab
    port: 9001
    php: true

  - name: cyberrange-lab
    port: 9002
    php: true

# Derived list used by the role — filtered by lab_mode
websites: >-
  {{
    websites_all
    | selectattr('name', 'equalto', 'vulnlab')       | list
    if lab_mode == 'training'
    else (
      websites_all
      | selectattr('name', 'equalto', 'cyberrange-lab') | list
      if lab_mode == 'exercise'
      else websites_all
    )
  }}
