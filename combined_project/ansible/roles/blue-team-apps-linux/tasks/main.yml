---
# roles/blue-team-apps-linux/tasks/main.yml
# Installs Blue Team default tools on Linux clients (excluding Kali — Kali has these already).
#
# Tools: Wireshark, Burpsuite, arp-scan, nmap

# ── WIRESHARK ─────────────────────────────────────────────────────────────────

- name: Stop and disable unattended-upgrades
  systemd:
    name: unattended-upgrades
    state: stopped
    enabled: no
  ignore_errors: yes

- name: Remove unattended-upgrades permanently
  apt:
    name: unattended-upgrades
    state: absent
    purge: yes
  ignore_errors: yes

- name: Add ansible user to wireshark group (non-root capture)
  user:
    name: "{{ ansible_user }}"
    groups: wireshark
    append: yes

# ── SUMMARY ───────────────────────────────────────────────────────────────────

- name: Show Blue Team apps installed
  debug:
    msg: "Blue Team Linux apps installed on {{ inventory_hostname }}: Wireshark, nmap, arp-scan, Burp Suite Community"
