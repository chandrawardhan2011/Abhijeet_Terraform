# =============================================================================
#  Shikra Insurance / ICP — Apache vhost configuration
#  Six subdomains under *.icp.lab, all on port 80 (HTTP-only, by design).
#  Drop into /etc/apache2/sites-available/ and a2ensite icp.
# =============================================================================

# ---- Public landing tier ---------------------------------------------------
<VirtualHost *:80>
    ServerName  icp.lab
    ServerAlias www.icp.lab
    DocumentRoot /var/www/icp/apps/landing/public

    <Directory /var/www/icp/apps/landing/public>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/icp_landing_error.log
    CustomLog ${APACHE_LOG_DIR}/icp_landing_access.log combined
</VirtualHost>

# ---- Sub-app I: policies.icp.lab -------------------------------------------
<VirtualHost *:80>
    ServerName  policies.icp.lab
    DocumentRoot /var/www/icp/apps/policies/public

    <Directory /var/www/icp/apps/policies/public>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # ICP_13 — directory listing intentionally enabled on /docs/
    <Directory /var/www/icp/apps/policies/public/docs>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/icp_policies_error.log
    CustomLog ${APACHE_LOG_DIR}/icp_policies_access.log combined
</VirtualHost>

# ---- Sub-app II: claims.icp.lab --------------------------------------------
<VirtualHost *:80>
    ServerName  claims.icp.lab
    DocumentRoot /var/www/icp/apps/claims/public

    <Directory /var/www/icp/apps/claims/public>
        Options FollowSymLinks
        AllowOverride None
        Require all granted

        # ICP_21 — uploads directory is browseable so a planted .php.pdf can be
        # discovered and triggered. (Vulnerability is intentional.)
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/icp_claims_error.log
    CustomLog ${APACHE_LOG_DIR}/icp_claims_access.log combined
</VirtualHost>

# ---- Sub-app III: status.icp.lab -------------------------------------------
<VirtualHost *:80>
    ServerName  status.icp.lab
    DocumentRoot /var/www/icp/apps/status/public

    <Directory /var/www/icp/apps/status/public>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        # ICP_35 — .git/ deliberately accessible. Apache's default would deny
        # dotfiles, but we override that here so the exposure is reachable.
    </Directory>

    # Allow .git to be served (ICP_35)
    <Directory /var/www/icp/apps/status/public/.git>
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/icp_status_error.log
    CustomLog ${APACHE_LOG_DIR}/icp_status_access.log combined
</VirtualHost>

# ---- Sub-app IV: beneficiary.icp.lab ---------------------------------------
<VirtualHost *:80>
    ServerName  beneficiary.icp.lab
    DocumentRoot /var/www/icp/apps/beneficiary/public

    <Directory /var/www/icp/apps/beneficiary/public>
