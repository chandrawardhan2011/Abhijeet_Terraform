    ErrorLog  ${APACHE_LOG_DIR}/icp_beneficiary_error.log
    CustomLog ${APACHE_LOG_DIR}/icp_beneficiary_access.log combined
</VirtualHost>

# ---- Sub-app V: admin.icp.lab ----------------------------------------------
<VirtualHost *:80>
    ServerName  admin.icp.lab
    DocumentRoot /var/www/icp/apps/admin/public

    <Directory /var/www/icp/apps/admin/public>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/icp_admin_error.log
    CustomLog ${APACHE_LOG_DIR}/icp_admin_access.log combined
</VirtualHost>
