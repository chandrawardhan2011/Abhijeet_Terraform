---
# roles/ftp-server/tasks/main.yml
# Installs and starts vsftpd on Ubuntu

- name: Stop and disable unattended-upgrades
  systemd:
    name: unattended-upgrades
    state: stopped
    enabled: no
  ignore_errors: yes

- name: Remove unattended-upgrades permanently
  apt:
    name: unattended-upgrades
    state: absent
    purge: yes
  ignore_errors: yes

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install vsftpd
  apt:
    name: vsftpd
    state: present

- name: Configure vsftpd
  copy:
    dest: /etc/vsftpd.conf
    content: |
      listen=YES
      listen_ipv6=NO
      anonymous_enable=NO
      local_enable=YES
      write_enable=YES
      local_umask=022
      dirmessage_enable=YES
      use_localtime=YES
      xferlog_enable=YES
      connect_from_port_20=YES
      xferlog_file=/var/log/vsftpd.log
      xferlog_std_format=YES
      idle_session_timeout=300
      data_connection_timeout=120
      ftpd_banner=CyberRange FTP Service
      chroot_local_user=YES
      allow_writeable_chroot=YES
      secure_chroot_dir=/var/run/vsftpd/empty
      pam_service_name=vsftpd
      pasv_enable=YES
      pasv_min_port=40000
      pasv_max_port=40100
      pasv_address={{ ansible_host }}
    backup: yes
  notify: restart vsftpd

- name: Ensure vsftpd empty chroot dir exists
  file:
    path: /var/run/vsftpd/empty
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Enable and start vsftpd service
  systemd:
    name: vsftpd
    enabled: yes
    state: started

- name: Allow FTP port 21 in UFW
  ufw:
    rule: allow
    port: '21'
    proto: tcp

- name: Allow FTP passive ports in UFW
  ufw:
    rule: allow
    port: '40000:40100'
    proto: tcp

- name: Verify vsftpd is running
  command: systemctl is-active vsftpd
  register: vsftpd_status
  changed_when: false

- name: Show vsftpd status
  debug:
    msg: "vsftpd on {{ inventory_hostname }} is {{ vsftpd_status.stdout }}"
