[defaults]
inventory           = inventory/hosts.ini
roles_path          = roles
host_key_checking   = False
timeout             = 30
forks               = 5
retry_files_enabled = False
stdout_callback     = ansible.builtin.default
result_format       = yaml
interpreter_python  = auto_silent

[privilege_escalation]
# become is set FALSE globally — each play in site.yml sets `become: yes`
# explicitly where needed. This prevents the "powershell incompatible with
# sudo become plugin" error on Windows hosts.
become          = False
become_method   = sudo
become_ask_pass = False

[ssh_connection]
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
pipelining = True
