---
# roles/wazuh-agent/tasks/main.yml
# Installs and registers Wazuh Agent on Linux (Ubuntu/Debian)
# Offline-aware: when offline_mode is true, installs from the local mirror.

- name: Stop and disable unattended-upgrades
  systemd:
    name: unattended-upgrades
    state: stopped
    enabled: no
  ignore_errors: yes

- name: Remove unattended-upgrades permanently
  apt:
    name: unattended-upgrades
    state: absent
    purge: yes
  ignore_errors: yes

# ── ONLINE MODE: add the public Wazuh repo ───────────────────────────────────

- name: Add Wazuh GPG key (online mode)
  apt_key:
    url: https://packages.wazuh.com/key/GPG-KEY-WAZUH
    state: present
  when: not (offline_mode | bool)

- name: Add Wazuh apt repository (online mode)
  apt_repository:
    repo: "deb https://packages.wazuh.com/4.x/apt/ stable main"
    state: present
    filename: wazuh
  when: not (offline_mode | bool)

# ── INSTALL (works for both modes — apt source already set correctly) ────────
- name: Install required dependencies
  apt:
    name:
      - curl
      - apt-transport-https
      - lsb-release
    state: present
    update_cache: yes

- name: Install gnupg (Ubuntu 22.04+)
  apt:
    name: gnupg
    state: present
  ignore_errors: yes

- name: Install gnupg2 (Ubuntu 20.04)
  apt:
    name: gnupg2
    state: present
  ignore_errors: yes

- name: Install Wazuh Agent
  apt:
    name: "{{ 'wazuh-agent' if (offline_mode | bool) else 'wazuh-agent=' + wazuh_version + '-*' }}"
    state: present
    update_cache: yes
  environment:
    WAZUH_MANAGER: "{{ wazuh_manager_ip }}"
    WAZUH_AGENT_NAME: "{{ inventory_hostname }}"

- name: Deploy agent ossec.conf pointing to Wazuh Manager
  template:
    src: agent-ossec.conf.j2
    dest: /var/ossec/etc/ossec.conf
    owner: root
    group: wazuh
    mode: '0640'
  notify: restart wazuh-agent

- name: Register agent with the Wazuh Manager
  command: >
    /var/ossec/bin/agent-auth -m {{ wazuh_manager_ip }} -A {{ inventory_hostname }}
  args:
    creates: /var/ossec/etc/client.keys

- name: Enable and start Wazuh Agent
  systemd:
    name: wazuh-agent
    enabled: yes
    state: restarted

- name: Verify Wazuh Agent is running
  command: systemctl is-active wazuh-agent
  register: agent_status
  changed_when: false

- name: Show agent status
  debug:
    msg: "Wazuh Agent on {{ inventory_hostname }} is {{ agent_status.stdout }} - reporting to {{ wazuh_manager_ip }}"
