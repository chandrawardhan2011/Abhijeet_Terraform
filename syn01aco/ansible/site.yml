---
# site.yml — Master playbook
# Pipeline order:
#   0. Wait for SSH/WinRM, then configure offline apt mirror on every VM
#   1. Wazuh Manager + Indexer + Dashboard  (must be up before agents register)
#   2. DB Server — MUST run before web-server (cyberrange-lab connects to it)
#   3. Web Servers (vulnlab + cyberrange-lab on separate ports)
#   4. FTP Server
#   5. Wazuh agents + Blue Agent on Linux clients
#   6. Wazuh agents + Blue Agent on Windows clients

# ── WAIT FOR LINUX SSH ────────────────────────────────────────────────────────
- name: "[0/7] Wait for all Linux VMs to be SSH ready"
  hosts: wazuh_servers:web_servers:db_servers:ftp_servers:linux_clients
  become: no
  gather_facts: no
  tasks:
    - name: Wait for SSH to be available (up to 5 min)
      wait_for_connection:
        delay: 30
        timeout: 360
        sleep: 10
    - name: Gather facts now that SSH is ready
      setup:

# ── WAIT FOR WINDOWS WINRM ────────────────────────────────────────────────────
- name: "[0/7] Wait for all Windows VMs to be WinRM ready"
  hosts: windows_clients
  gather_facts: no
  become: no
  tasks:
    - name: Wait for WinRM to be available (up to 7 min)
      wait_for_connection:
        delay: 30
        timeout: 420
        sleep: 10

# ── CONFIGURE OFFLINE APT MIRROR ON EVERY LINUX VM ───────────────────────────
- name: "[1/7] Configure offline apt mirror (all Linux VMs)"
  hosts: wazuh_servers:web_servers:db_servers:ftp_servers:linux_clients
  become: yes
  roles:
    - offline-repo

# ── WAZUH MANAGER + INDEXER + DASHBOARD ──────────────────────────────────────
- name: "[2/7] Configure Wazuh Server (Manager + Indexer + Dashboard)"
  hosts: wazuh_servers
  become: yes
  roles:
    - wazuh-server
    - blue-agent-linux

# ── DB SERVER — runs BEFORE web-server so cyber_range DB is ready ─────────────
- name: "[3/7] Configure DB Server (MariaDB + cyber_range database)"
  hosts: db_servers
  become: yes
  roles:
    - db-server
    - wazuh-agent
    - blue-agent-linux

# ── WEB SERVER — vulnlab (:9001) + cyberrange-lab (:9002) ─────────────────────
- name: "[4/7] Configure Web Server (vulnlab + cyberrange-lab)"
  hosts: web_servers
  become: yes
  roles:
    - web-server
    - wazuh-agent
    - blue-agent-linux

# ── FTP SERVER ────────────────────────────────────────────────────────────────
- name: "[5/7] Configure FTP Server (vsftpd)"
  hosts: ftp_servers
  become: yes
  roles:
    - ftp-server
    - wazuh-agent
    - blue-agent-linux

# ── LINUX CLIENTS — Wazuh Agent + Blue Team Tools ────────────────────────────
- name: "[6/7] Deploy Wazuh Agent + Blue Agent - Linux Clients"
  hosts: linux_clients
  become: yes
  roles:
    - wazuh-agent
    - blue-agent-linux
    - blue-team-apps-linux

# ── WINDOWS CLIENTS — Wazuh Agent + Blue Team Tools ──────────────────────────
- name: "[7/7] Deploy Wazuh Agent + Blue Agent - Windows Clients"
  hosts: windows_clients
  become: no
  roles:
    - wazuh-agent-windows
    - blue-agent-windows
    - blue-team-apps-windows
    - domain-join
